<svg width="64" height="64" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="ptFaviconPin" x1="24" y1="12" x2="24" y2="38" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stopColor="#06B6D4" />
            <stop offset="100%" stopColor="#0284C7" />
        </linearGradient>
        <linearGradient id="ptFaviconTrack" x1="6" y1="41" x2="42" y2="41" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stopColor="#38BDF8" stopOpacity="0.2" />
            <stop offset="50%" stopColor="#38BDF8" stopOpacity="1" />
            <stop offset="100%" stopColor="#38BDF8" stopOpacity="0.2" />
        </linearGradient>
    </defs>

    <!-- Background for high contrast in browser tabs (dark & light) -->
    <rect width="48" height="48" rx="12" fill="#0B0F17" />

    <!-- 1. Telemetry Waves (IoT Signal) -->
    <path d="M 11 11 C 18 4.5, 30 4.5, 37 11" stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 15.5 14.5 C 20.5 10.5, 27.5 10.5, 32.5 14.5" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />

    <!-- 2. Geo-Pin (Hyperlocal Sensor Location) -->
    <path d="M 24 37.5 C 22.8 35.5 15 27.8 15 21 C 15 16 19 12 24 12 C 29 12 33 16 33 21 C 33 27.8 25.2 35.5 24 37.5 Z" fill="url(#ptFaviconPin)" />

    <!-- Pin Sensor Chamber Core -->
    <circle cx="24" cy="21" r="5" fill="#0B0F17" />
    <circle cx="24" cy="21" r="2.4" fill="#38BDF8" />

    <!-- 3. Transit Corridor Lane (Mobile Vehicle Path) -->
    <path d="M 7 41 C 18 38.5, 30 38.5, 41 41" stroke="url(#ptFaviconTrack)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="24" cy="38" r="1.5" fill="#38BDF8" />
</svg>
